[pytest]
testpaths = tests

# `para_entrega/` lleva una copia de test_secciones.py para la entrega. Sin
# esto, pytest encuentra DOS módulos con el mismo nombre base y aborta la
# recolección con "import file mismatch" antes de ejecutar nada.
norecursedirs = para_entrega .git __pycache__ .pytest_cache results unity docs